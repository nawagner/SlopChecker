# Nixpacks Python provider uses pip here (no uv.lock committed), which
# sidesteps the UV_PROJECT_ENVIRONMENT / "uvicorn: command not found"
# boot failure hit on a different uv-managed Railway project. If a uv.lock
# ever gets added to this repo, revisit that setting first.

[build]
builder = "NIXPACKS"
# pdf/docx: /check ingests uploaded PDFs and DOCX in production. llm: the
# claims lens imports anthropic at check time — without the package it shows
# as an errored row on every live report (with it but no ANTHROPIC_API_KEY,
# a clean skipped row).
buildCommand = "pip install -e '.[web,pdf,docx,llm]'"

[deploy]
startCommand = "uvicorn slopchecker.web:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
