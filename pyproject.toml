[project]
name = "slopchecker"
version = "0.1.0"
description = "Automating slop checks for funding proposals"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavy/optional deps live behind extras so someone working on citations
# doesn't need the PDF or LLM stack installed (see #2).
pdf = ["pymupdf>=1.24"]
docx = ["python-docx>=1.1"]
llm = ["anthropic>=0.40"]
# The web layer over the pipeline (#27) — see slopchecker/web.py.
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# Validation harness (#29): planted-defect injector + recall report.
harness = ["pyyaml>=6.0"]
# Corpus similarity check (#14): MinHash + LSH for near-duplicate detection.
similarity = ["datasketch>=1.6"]
# pytest-xdist is for the `live` suite only (network-bound, -n 4 in CI).
# The unit suite stays serial — it is CPU-bound, so workers cost more
# than they save (#114, #143).
dev = ["ruff>=0.5", "pytest>=8.2", "mypy>=1.10", "pytest-xdist>=3.6"]

[project.scripts]
slopcheck = "slopchecker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slopchecker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run = fast unit suite, no network, no subprocesses. Two opt-in
# families sit outside it; CI runs both, so nothing is lost by deselecting
# them here (#114):
#   `pytest -m integration` — full CLI chain (#81), same job as the unit run
#   `pytest -m live`        — real calls to doi.org/Crossref/OpenAlex/arXiv,
#                             its own CI job so a third-party outage can't
#                             red the required check
# The live tests were 17.6s of a 20.1s default run — 88% of the suite was
# network wait. Keeping them out of the edit-test loop is the whole point.
addopts = "-m 'not integration and not live'"
markers = [
    "integration: full CLI chain in real subprocesses (opt in: pytest -m integration)",
    "live: really calls third-party APIs (opt in: pytest -m live)",
]

[tool.mypy]
python_version = "3.11"
packages = ["slopchecker"]
# Non-blocking to start (#2) — tighten once the data model in #3 lands.
ignore_missing_imports = true
