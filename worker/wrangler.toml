name = "slopchecker-web"
main = "src/index.ts"
compatibility_date = "2026-07-31"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Not a secret — Railway's public service URL, just a proxy target.
RAILWAY_API_URL = "https://slopchecker-production.up.railway.app"

# Custom domain: run after slop-checker.com's DNS is on Cloudflare —
#   wrangler deploy
#   wrangler route add "slop-checker.com/*" slopchecker-web
